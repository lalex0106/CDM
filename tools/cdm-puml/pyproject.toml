[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdm-puml"
version = "0.1.0"
description = "CDM PlantUML generator with bilingual labels"
authors = [{ name = "AutoGenerated" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "openpyxl",
  "pyyaml",
  "commondatamodel-objectmodel",
]

[project.scripts]
cdm-generate-puml = "cdm_puml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
